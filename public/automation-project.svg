<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AI automation systems project card</title>
  <desc id="desc">Dark automation system diagram with agents, QA gates and human review loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#94a3b8" stroke-width="1">
    <path d="M0 95h1200M0 190h1200M0 285h1200M0 380h1200M0 475h1200M0 570h1200"/>
    <path d="M100 0v675M200 0v675M300 0v675M400 0v675M500 0v675M600 0v675M700 0v675M800 0v675M900 0v675M1000 0v675M1100 0v675"/>
  </g>
  <circle cx="600" cy="335" r="230" fill="#8b5cf6" opacity="0.10" filter="url(#glow)"/>
  <g stroke="url(#line)" stroke-width="8" stroke-linecap="round" opacity="0.9">
    <path d="M260 336h190M750 336h190M600 205v90M600 380v90"/>
  </g>
  <g fill="#0b1220" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2">
    <rect x="150" y="248" width="220" height="176" rx="24"/>
    <rect x="490" y="248" width="220" height="176" rx="24"/>
    <rect x="830" y="248" width="220" height="176" rx="24"/>
    <rect x="470" y="78" width="260" height="116" rx="22"/>
    <rect x="470" y="482" width="260" height="116" rx="22"/>
  </g>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <text x="260" y="315" fill="#c4b5fd" font-size="30" font-weight="700">Research</text>
    <text x="260" y="360" fill="#e5e7eb" font-size="20">data + signals</text>
    <text x="600" y="315" fill="#86efac" font-size="30" font-weight="700">Agents</text>
    <text x="600" y="360" fill="#e5e7eb" font-size="20">scheduled workflows</text>
    <text x="940" y="315" fill="#67e8f9" font-size="30" font-weight="700">QA Gates</text>
    <text x="940" y="360" fill="#e5e7eb" font-size="20">logs + review</text>
    <text x="600" y="145" fill="#f8fafc" font-size="28" font-weight="700">LLM APIs</text>
    <text x="600" y="550" fill="#f8fafc" font-size="28" font-weight="700">Human-in-the-loop</text>
  </g>
  <text x="90" y="612" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="22">AI systems • automation • monitoring • safer operations</text>
</svg>
