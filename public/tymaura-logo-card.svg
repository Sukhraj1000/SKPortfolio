<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Tymaura logo</title>
  <desc id="desc">Tymaura orbital logo mark with wordmark on a dark teal gradient background.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#123a3a"/>
      <stop offset="0.42" stop-color="#081f2a"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#2dd4bf" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <path d="M0 135h1200M0 270h1200M0 405h1200M0 540h1200"/>
    <path d="M150 0v675M300 0v675M450 0v675M600 0v675M750 0v675M900 0v675M1050 0v675"/>
  </g>

  <g transform="translate(600 270) scale(9.5)" fill="none" stroke-linecap="round" filter="url(#softGlow)">
    <ellipse cx="0" cy="0" rx="10" ry="4" stroke="#2dd4bf" stroke-width="1.25" stroke-opacity="0.72" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="10" ry="4" stroke="#2dd4bf" stroke-width="1.25" stroke-opacity="0.46" transform="rotate(30)"/>
    <circle cx="0" cy="0" r="2.2" fill="#2dd4bf" stroke="none"/>
    <circle cx="-8.7" cy="5" r="1.1" fill="#2dd4bf" stroke="none" fill-opacity="0.95"/>
    <circle cx="8.7" cy="-5" r="1.1" fill="#2dd4bf" stroke="none" fill-opacity="0.95"/>
    <circle cx="-8.7" cy="-5" r="0.85" fill="#2dd4bf" stroke="none" fill-opacity="0.7"/>
    <circle cx="8.7" cy="5" r="0.85" fill="#2dd4bf" stroke="none" fill-opacity="0.7"/>
    <circle cx="-2" cy="-3.5" r="0.7" fill="#2dd4bf" stroke="none" fill-opacity="0.5"/>
  </g>

  <text x="600" y="455" text-anchor="middle" fill="#ecfeff" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="68" font-weight="300" letter-spacing="14">TYMAURA</text>
  <text x="600" y="506" text-anchor="middle" fill="#99f6e4" fill-opacity="0.82" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" letter-spacing="4">EVENTS • RSVP • VENDORS</text>
</svg>
