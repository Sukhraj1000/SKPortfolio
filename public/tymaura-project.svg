<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Tymaura event platform project card</title>
  <desc id="desc">Dark premium event planning platform illustration with vendor, guest and admin workflow cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#1b1235"/>
      <stop offset="1" stop-color="#27104d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="960" cy="110" r="190" fill="#8b5cf6" opacity="0.18" filter="url(#glow)"/>
  <circle cx="170" cy="560" r="220" fill="#22d3ee" opacity="0.12" filter="url(#glow)"/>
  <g opacity="0.13" stroke="#fff" stroke-width="1">
    <path d="M0 120h1200M0 240h1200M0 360h1200M0 480h1200M0 600h1200"/>
    <path d="M120 0v675M240 0v675M360 0v675M480 0v675M600 0v675M720 0v675M840 0v675M960 0v675M1080 0v675"/>
  </g>
  <rect x="135" y="120" width="930" height="435" rx="34" fill="#070b16" opacity="0.72" stroke="#ffffff" stroke-opacity="0.14"/>
  <rect x="180" y="168" width="300" height="270" rx="22" fill="#111827" stroke="#8b5cf6" stroke-opacity="0.45"/>
  <rect x="520" y="168" width="300" height="270" rx="22" fill="#111827" stroke="#22d3ee" stroke-opacity="0.4"/>
  <rect x="860" y="168" width="160" height="270" rx="22" fill="#111827" stroke="#ffffff" stroke-opacity="0.22"/>
  <text x="220" y="230" fill="#c4b5fd" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">Vendors</text>
  <text x="560" y="230" fill="#67e8f9" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">Guests</text>
  <text x="900" y="230" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Admin</text>
  <g fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" opacity="0.95">
    <path d="M245 300h165M245 352h118M585 300h165M585 352h118M902 300h72M902 352h54"/>
  </g>
  <g fill="#fff" opacity="0.7" font-family="Inter,Arial,sans-serif" font-size="22">
    <text x="180" y="500">Tymaura</text>
    <text x="760" y="500">events • RSVP • messaging • readiness</text>
  </g>
</svg>
